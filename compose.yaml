
services:
  db:
    image: postgres:17-alpine
    container_name: billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing_app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_app -d billing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
